name: Build and release

# Every push builds a signed APK you can download from the run page (Artifacts).
# Only pushes to main also publish a release, which Obtainium on the phone watches.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run bridge tests
        working-directory: bridge
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "JarvisAssist-0.1.${{ github.run_number }}.apk"

      - name: Keep the APK from this run
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAssist-0.1.${{ github.run_number }}
          path: JarvisAssist-0.1.${{ github.run_number }}.apk
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: v0.1.${{ github.run_number }}
          files: JarvisAssist-0.1.${{ github.run_number }}.apk

      - name: Delete signing key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
