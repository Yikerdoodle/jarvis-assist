plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The build robot passes these in. Local builds without them get a debug-only version number.
def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as int
def keystorePath = System.getenv('KEYSTORE_PATH')

android {
    namespace 'io.github.jarvisassist'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.jarvisassist'
        minSdk 34
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Gemini Nano through Android's AICore (on-device, no network). Google's beta API: it may change.
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta5'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    testImplementation 'junit:junit:4.13.2'
}
